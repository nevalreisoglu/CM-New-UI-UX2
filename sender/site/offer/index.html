<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo Telco — Offers for you</title>
<style>
  :root{--navy:#242441;--lilac:#5D5D8D;--orange:#F58220;--cta:#00818F;--cta-h:#00707E;--ink:#242441;--ink-2:#4A4A60;--line:#DFE1DF;--bg:#F2F3F5;--ok:#2A7230;--ok-soft:#E8F3E8;--acc-soft:#E2F6F8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,Arial,sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  header i{width:18px;height:18px;border-radius:4px;background:var(--orange);display:inline-block}
  header span{margin-left:auto;font-weight:400;font-size:13px}
  main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;line-height:1.25;font-weight:500;margin:0 0 2px}
  .sub{color:var(--ink-2);margin:0 0 22px}
  h2{font-size:16px;font-weight:500;margin:0 0 10px}
  .offer{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:8px;padding:18px}
  .pill{display:inline-block;background:var(--acc-soft);color:var(--cta-h);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
  .offer b{display:block;font-size:20px;line-height:1.3;margin:8px 0 4px}
  .offer p{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}
  button{background:var(--cta);color:#fff;border:0;border-radius:6px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--cta-h)}
  .done{display:none;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:10px 14px;font-weight:500}
  .none{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;color:var(--ink-2)}
  footer{margin-top:28px;font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
<header><i></i>Demo Telco <span id="acct">My account</span></header>
<main>
  <h1 id="hi">Welcome</h1>
  <p class="sub" id="plan"></p>
  <h2>Offers for you</h2>
  <div class="offer" id="offer" hidden>
    <span class="pill">For you</span>
    <b id="oname"></b>
    <p id="ometa"></p>
    <button id="act" type="button">Activate</button>
    <div class="done" id="done" role="status">✓ Activated — it is on your account now.</div>
  </div>
  <div class="none" id="none" hidden>No offer is waiting for you right now.</div>
  <footer>Test page · sent to one test recipient only.</footer>
</main>
<script>
  /* every value comes from the link the test message carried; nothing is requested or stored */
  var q = new URLSearchParams(location.search), t = function (id, v) { document.getElementById(id).textContent = v; };
  var name = (q.get('n') || '').slice(0, 40), plan = (q.get('p') || '').slice(0, 40), offer = (q.get('o') || '').slice(0, 80), days = parseInt(q.get('d'), 10), from = (q.get('j') || '').slice(0, 80);
  t('hi', name ? 'Hi ' + name : 'Welcome'); if (name) t('acct', 'Signed in as ' + name);
  t('plan', plan ? plan + ' plan' : '');
  if (offer) {
    document.getElementById('offer').hidden = false; t('oname', offer);
    t('ometa', [days > 0 ? 'Valid ' + days + ' days' : '', from].filter(Boolean).join(' · '));
    document.getElementById('act').onclick = function () { this.style.display = 'none'; document.getElementById('done').style.display = 'block'; };
  } else document.getElementById('none').hidden = false;
</script>
</body>
</html>
